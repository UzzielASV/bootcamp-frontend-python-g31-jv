<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Uzziel Solís</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header class="header wrapper">
        <span class="header__logo"><img src="images/logo.svg" alt="Logo"></span>

        <nav class="header__nav">
            <a href="index.html">Acerca de mí</a>
            <a href="habilidades.html">Habilidades</a>
            <a href="portafolio.html">Portafolio</a>
        </nav>

        <article class="header__links">
            <img src="images/icon-github.svg" alt="GitHub">
            <img src="images/icon-linkedin.svg" alt="LinkedIn">
        </article>
    </header>

    <main>
        <section class="hero">
            <h2 class="hero__gretting">Hola, soy <span>Uzziel Solís</span> 🧑‍💻</h2>
            <h1 class="hero__title">Desarrollador Web Full-Stack</h1>
            <p class="hero__description">Desarrollador especializado en JavaScript, React.js, Vue, Python y Node.js</p>

            <img class="hero__photo" src="images/foto.png" alt="Imagen de Uzziel Solís">
        </section>

        <section class="stack">
            <article class="stack__wrapper">
                <h3 class="stack__title">HTML</h3>
                <div class="stack__image">
                    <img src="images/html.svg" alt="HTML">
                </div>
            </article>

            <article class="stack__wrapper">
                <h3 class="stack__title">CSS</h3>
                <div class="stack__image">
                    <img src="images/css.svg" alt="CSS">
                </div>
            </article>

            <article class="stack__wrapper">
                <h3 class="stack__title">JavaScript</h3>
                <div class="stack__image">
                    <img src="images/javascript.svg" alt="JavaScript">
                </div>
            </article>

            <article class="stack__wrapper">
                <h3 class="stack__title">React.js</h3>
                <div class="stack__image">
                    <img src="images/react.svg" alt="React.js">
                </div>
            </article>

            <article class="stack__wrapper">
                <h3 class="stack__title">Node.js</h3>
                <div class="stack__image">
                    <img src="images/node.svg" alt="Node.js">
                </div>
            </article>

            <article class="stack__wrapper">
                <h3 class="stack__title">Python</h3>
                <div class="stack__image">
                    <img src="images/python.svg" alt="Python">
                </div>
            </article>

        </section>
    </main>

</body>
</html>
