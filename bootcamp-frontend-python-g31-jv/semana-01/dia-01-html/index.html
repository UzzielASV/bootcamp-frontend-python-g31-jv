<!DOCTYPE html>
<!-- Declara que el documento utiliza la versión HTML5. -->
<html lang="es">
<!-- <html> es el elemento raíz; lang="es" indica que el contenido está escrito en español. -->
<head>
    <!-- <head> contiene información y configuraciones del documento que no aparecen directamente en la página. -->

    <!-- Define UTF-8 como codificación para mostrar correctamente tildes, la letra ñ y otros caracteres especiales. -->
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte al ancho de la pantalla de celulares, tabletas y computadoras. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- <title> define el título de la página que aparece en la pestaña del navegador. -->
    <title>Mi primera página - G31</title>
</head>
<body>
<!-- <body> contiene todos los elementos visibles de la página web. -->

<!-- <h1> texto </h1> define el encabezado principal y de mayor jerarquía de la página. -->
    <h1>
        Uzziel Solís
    </h1>

<!-- <p> texto </p> define un párrafo de texto. -->
    <p>
        La etiqueta <code>&lt;p&gt; texto &lt;/p&gt;</code> para definir un párrafo de texto.
    </p>

<!-- <code> texto </code> identifica y muestra un fragmento corto de código dentro de una línea de texto. -->
    <p>
        La etiqueta <code>&lt;code&gt; texto &lt;/code&gt;</code> se usa para mostrar pequeños fragmentos de código de ordenador en la pantalla.
    </p>

<!-- &lt; representa el signo < y &gt; representa el signo >. Al escapar también el símbolo &, se muestran literalmente los textos &lt; y &gt;. -->
    <p>
        &amp;lt; y &amp;gt; se utilizan para representar los signos &lt; y &gt; como texto visible en HTML.
    </p>
</body>
</html>
